name: "Internal: Release Implementation (reusable)"
on:
  workflow_call:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Validate bump input
        run: |
          case "${{ inputs.bump }}" in
            patch|minor|major) ;;
            *) echo "Invalid bump value: '${{ inputs.bump }}'. Must be patch, minor, or major." >&2; exit 1 ;;
          esac

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Bump version
        id: version
        run: |
          MARKETING_VERSION=$(grep '^MARKETING_VERSION=' version.env | cut -d= -f2)
          BUILD_NUMBER=$(grep '^BUILD_NUMBER=' version.env | cut -d= -f2)
          IFS='.' read -r major minor patch <<< "$MARKETING_VERSION"

          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          NEW_VERSION="${major}.${minor}.${patch}"
          NEW_BUILD=$((BUILD_NUMBER + 1))

          echo "MARKETING_VERSION=${NEW_VERSION}" > version.env
          echo "BUILD_NUMBER=${NEW_BUILD}" >> version.env

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${NEW_BUILD}" >> "$GITHUB_OUTPUT"
          echo "Bumped to v${NEW_VERSION} (build ${NEW_BUILD})"

      - name: Test
        run: go test ./...

      - name: Build release binaries (amd64 + arm64, macOS + Linux)
        id: build
        env:
          CGO_ENABLED: "0"
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          LDFLAGS="-s -w -X github.com/yashiels/investec/internal/cli.Version=${VERSION}"

          # <GOOS> <GOARCH> <artifact-suffix> — build, tarball, sha, emit outputs.
          build() {
            local goos="$1" goarch="$2" suffix="$3"
            GOOS="$goos" GOARCH="$goarch" go build -ldflags "$LDFLAGS" -o investec ./cmd/investec
            local tar="investec-v${VERSION}-${suffix}.tar.gz"
            tar -czf "$tar" investec
            rm -f investec
            local sha
            sha=$(shasum -a 256 "$tar" | awk '{print $1}')
            local key="${suffix//-/_}"
            echo "${key}_tar=${tar}" >> "$GITHUB_OUTPUT"
            echo "${key}_sha=${sha}" >> "$GITHUB_OUTPUT"
            echo "${suffix}: ${sha}  (${tar})"
          }

          build darwin arm64 darwin-arm64
          build darwin amd64 darwin-amd64
          build linux  amd64 linux-amd64
          build linux  arm64 linux-arm64

      - name: Commit version bump (verified, via GitHub API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="${GITHUB_REF_NAME}"
          HEAD_OID=$(git rev-parse HEAD)
          # Commits created through the GraphQL API are GPG-signed by GitHub's
          # web-flow key and land "Verified" — required if the repo enforces the
          # "Commits must have verified signatures" branch rule.
          additions=$(jq -n \
            --arg p1 version.env --arg c1 "$(base64 < version.env | tr -d '\n')" \
            '[{path:$p1,contents:$c1}]')
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg branch "$BRANCH" \
            --arg oid "$HEAD_OID" \
            --arg headline "chore(release): bump version to ${VERSION}" \
            --argjson additions "$additions" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $oid,
                message: {headline: $headline},
                fileChanges: {additions: $additions}
              }}}' \
            | gh api graphql --input -

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="### Install"$'\n'"brew install yashiels/tap/investec"$'\n\n'"Or download a tarball below (macOS + Linux, amd64 + arm64)."$'\n\n'"**SHA-256**"$'\n'"- darwin-arm64: ${{ steps.build.outputs.darwin_arm64_sha }}"$'\n'"- darwin-amd64: ${{ steps.build.outputs.darwin_amd64_sha }}"$'\n'"- linux-amd64: ${{ steps.build.outputs.linux_amd64_sha }}"$'\n'"- linux-arm64: ${{ steps.build.outputs.linux_arm64_sha }}"
          gh release create "v${VERSION}" \
            "${{ steps.build.outputs.darwin_arm64_tar }}" \
            "${{ steps.build.outputs.darwin_amd64_tar }}" \
            "${{ steps.build.outputs.linux_amd64_tar }}" \
            "${{ steps.build.outputs.linux_arm64_tar }}" \
            --title "investec v${VERSION}" \
            --generate-notes \
            --notes "$NOTES"

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          export DARWIN_ARM64_SHA="${{ steps.build.outputs.darwin_arm64_sha }}"
          export DARWIN_AMD64_SHA="${{ steps.build.outputs.darwin_amd64_sha }}"
          export LINUX_AMD64_SHA="${{ steps.build.outputs.linux_amd64_sha }}"
          export LINUX_ARM64_SHA="${{ steps.build.outputs.linux_arm64_sha }}"

          WORK=$(mktemp -d)
          git clone "https://github.com/yashiels/homebrew-tap.git" "$WORK"
          cd "$WORK"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 -c "
          import os, textwrap
          v = '${VERSION}'
          base = 'https://github.com/yashiels/investec/releases/download/v' + v
          d_arm, d_amd = os.environ['DARWIN_ARM64_SHA'], os.environ['DARWIN_AMD64_SHA']
          l_amd, l_arm = os.environ['LINUX_AMD64_SHA'], os.environ['LINUX_ARM64_SHA']
          formula = f'''class Investec < Formula
            desc \"Read-only CLI for the Investec SA Private Bank API\"
            homepage \"https://github.com/yashiels/investec\"
            version \"{v}\"
            license \"MIT\"

            on_macos do
              if Hardware::CPU.arm?
                url \"{base}/investec-v{v}-darwin-arm64.tar.gz\"
                sha256 \"{d_arm}\"
              else
                url \"{base}/investec-v{v}-darwin-amd64.tar.gz\"
                sha256 \"{d_amd}\"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url \"{base}/investec-v{v}-linux-arm64.tar.gz\"
                sha256 \"{l_arm}\"
              else
                url \"{base}/investec-v{v}-linux-amd64.tar.gz\"
                sha256 \"{l_amd}\"
              end
            end

            def install
              bin.install \"investec\"
            end

            test do
              assert_match version.to_s, shell_output(\"#{{bin}}/investec --version\")
            end
          end
          '''
          open('Formula/investec.rb', 'w').write(textwrap.dedent(formula).lstrip())
          "

          git add Formula/investec.rb
          git commit -m "chore: bump investec to v${VERSION}"
          git remote set-url origin "https://x-access-token:${TAP_TOKEN}@github.com/yashiels/homebrew-tap.git"
          git push origin main

      - name: Upload artifacts
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4
        with:
          name: investec-v${{ steps.version.outputs.version }}-binaries
          path: |
            ${{ steps.build.outputs.darwin_arm64_tar }}
            ${{ steps.build.outputs.darwin_amd64_tar }}
            ${{ steps.build.outputs.linux_amd64_tar }}
            ${{ steps.build.outputs.linux_arm64_tar }}
